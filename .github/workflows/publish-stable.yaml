name: Publish coordinated stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict SemVer used by both products
        required: true
        type: string
      sequence:
        description: Monotonically increasing release sequence
        required: true
        type: number

run-name: Publish stable ${{ inputs.version }} (sequence ${{ inputs.sequence }})

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: stable-publishing
    steps:
      - uses: actions/checkout@v6
      - name: Verify coordinator
        run: python -m unittest discover -s tests -v
      - name: Reject replayed sequence
        shell: bash
        run: |
          current=$(tr -d '[:space:]' < sequence.txt)
          if (( ${{ inputs.sequence }} <= current )); then
            echo "Sequence must be greater than $current" >&2
            exit 1
          fi
      - name: Dispatch product builds
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_BUILD_TOKEN }}
        shell: bash
        run: |
          for repo in Dahlqvistad/weaving_computer.host Dahlqvistad/weaving_computer.frontend; do
            if gh release view "v${{ inputs.version }}" --repo "$repo" > /dev/null 2>&1; then
              echo "$repo already has release v${{ inputs.version }}; reusing it."
              continue
            fi
            gh workflow run release-coordinated.yaml --repo "$repo" \
              --ref "v${{ inputs.version }}" \
              -f version="${{ inputs.version }}" \
              -f sequence="${{ inputs.sequence }}" \
              -f profile_ref="${{ github.sha }}"
          done
      - name: Wait for product builds and download release assets
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_BUILD_TOKEN }}
        shell: bash
        run: |
          mkdir -p incoming
          event="workflow_dispatch"
          version_label="${{ inputs.version }}"
          coordinator_started_at=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq .created_at)
          for item in \
            "Dahlqvistad/weaving_computer.host|Coordinated host $version_label|host" \
            "Dahlqvistad/weaving_computer.frontend|Coordinated frontend $version_label|frontend"; do
            IFS='|' read -r repo title component <<< "$item"
            if ! gh release view "v${{ inputs.version }}" --repo "$repo" > /dev/null 2>&1; then
              tag_commit=$(gh api "repos/$repo/commits/v${{ inputs.version }}" --jq .sha)
              run_id=""
              for attempt in $(seq 1 30); do
                run_id=$(gh run list --repo "$repo" \
                  --workflow release-coordinated.yaml --event "$event" \
                  --limit 30 --json databaseId,displayTitle,headSha,createdAt \
                  --jq ".[] | select(.displayTitle == \"$title\" and .headSha == \"$tag_commit\" and .createdAt >= \"$coordinator_started_at\") | .databaseId" \
                  | head -n 1)
                if [[ -n "$run_id" ]]; then break; fi
                sleep 10
              done
              if [[ -z "$run_id" ]]; then
                echo "Could not find current build run for $repo" >&2
                exit 1
              fi
              gh run watch "$run_id" --repo "$repo" --exit-status
            fi
            release_directory="incoming/$component/${component}-windows-x86_64"
            mkdir -p "$release_directory"
            gh release download "v${{ inputs.version }}" --repo "$repo" \
              --dir "$release_directory"
          done
      - name: Assemble and verify Pages feed
        run: >-
          python scripts/assemble_feed.py incoming public
          --sequence "${{ inputs.sequence }}"
          --extensions extensions.toml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published sequence
        shell: bash
        run: |
          echo "${{ inputs.sequence }}" > sequence.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sequence.txt
          git commit -m "Publish ${{ inputs.version }} (sequence ${{ inputs.sequence }})"
          git push
